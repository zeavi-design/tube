<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<script>
  // This page has a real origin (github.io), so when it loads YouTube's
  // embed, the browser sends a Referer and the player agrees to play.
  const id = new URLSearchParams(location.search).get("v") || "";

  // Only accept something shaped like a YouTube video ID (11 chars of
  // letters, digits, - and _). Never trust input from the URL: without
  // this check, anyone could make this page load whatever they put in ?v=.
  if (/^[A-Za-z0-9_-]{11}$/.test(id)) {
    const frame = document.createElement("iframe");
    frame.src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0";
    frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    frame.allowFullscreen = true;
    document.body.append(frame);
  } else {
    document.body.innerHTML = '<p style="color:#aaa;font-family:system-ui;padding:16px">No valid video ID.</p>';
  }
</script>
</body>
</html>
