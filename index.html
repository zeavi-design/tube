<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tube</title>
<style>
  /* Colors live in variables so dark mode is just "swap the values". */
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #606060; --card: #f2f2f2;
    --border: #dddddd; --accent: #cc0000; --link: #065fd4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f0f; --fg: #f1f1f1; --muted: #aaaaaa; --card: #1f1f1f;
      --border: #303030; --accent: #ff4e45; --link: #3ea6ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.4; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px;
  }
  .logo { font-weight: 700; font-size: 1.25em; color: var(--accent); }
  header form { flex: 1; display: flex; min-width: 220px; }
  header input {
    flex: 1; padding: 8px 14px; font: inherit; color: var(--fg); background: var(--card);
    border: 1px solid var(--border); border-radius: 20px 0 0 20px; outline: none;
  }
  header form button { border-radius: 0 20px 20px 0; border-left: 0; }
  header input { min-width: 0; }         /* inputs have a built-in minimum width; allow shrinking */
  @media (max-width: 600px) {
    header form { order: 3; flex-basis: 100%; min-width: 0; }  /* search gets its own row */
    nav { gap: 12px; }
  }
  nav { display: flex; gap: 14px; font-size: .95em; }
  nav a { color: var(--muted); }
  #quota { font-size: .8em; color: var(--muted); }

  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3em; margin: 12px 0 8px; }
  h2 { font-size: 1.15em; }
  .meta { color: var(--muted); font-size: .9em; }

  .btn {
    display: inline-block; padding: 8px 16px; font: inherit; cursor: pointer;
    color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn:hover { text-decoration: none; filter: brightness(1.1); }
  .more { display: table; margin: 24px auto; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px 16px; }
  .card { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .thumb { position: relative; display: block; }
  .thumb img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: var(--card); display: block; }
  .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; padding: 1px 5px; border-radius: 4px; }
  .card .title {
    font-weight: 600; margin-top: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .player { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 10px 0; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--card); object-fit: cover; }
  .avatar.big { width: 80px; height: 80px; }
  .box { background: var(--card); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .box a, .notice a { color: var(--link); }

  .comment { display: flex; gap: 12px; margin: 16px 0; }
  .comment p { margin: 2px 0; white-space: pre-wrap; overflow-wrap: anywhere; }

  .notice { background: var(--card); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 6px; margin: 12px 0; }
  .list-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .list-item .grow { flex: 1; min-width: 0; }
  label input { display: block; width: 100%; max-width: 480px; margin: 6px 0 10px; padding: 8px 12px; font: inherit;
    color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
</style>
</head>
<body>

<header>
  <a class="logo" href="#/">▶ Tube</a>
  <form id="search-form">
    <input id="q" type="search" placeholder="Search" autocomplete="off">
    <button class="btn" type="submit">Search</button>
  </form>
  <nav>
    <a href="#/">Feed</a>
    <a href="#/subs">Subscriptions</a>
    <a href="#/history">History</a>
    <a href="#/settings">Settings</a>
  </nav>
  <span id="quota"></span>
</header>

<main></main>

<script>
"use strict";

/* =========================================================================
   1. STORAGE
   localStorage only holds strings, so we JSON-encode everything.
   try/catch because storage can be disabled (private windows, etc.).
   ========================================================================= */
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
};

/* =========================================================================
   2. TEXT SAFETY
   API text (titles, comments) is untrusted. If we put it into innerHTML raw,
   a title like <img onerror=...> would run code. So: decode the HTML
   entities YouTube sends (&#39; etc.), then escape before rendering.
   ========================================================================= */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function decode(s) {
  const t = document.createElement("textarea"); // textarea never runs scripts
  t.innerHTML = s ?? "";
  return t.value;
}

// Turn bare URLs in already-escaped text into links.
const linkify = (escaped) => escaped.replace(/https?:\/\/[^\s<]+/g,
  (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

/* =========================================================================
   3. QUOTA TRACKING (an estimate kept in this browser)
   Google resets the quota at midnight Pacific time, so we key by that date.
   ========================================================================= */
const DAILY_QUOTA = 10000;
const COST = { search: 100 };            // every other endpoint we use costs 1
const todayPT = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" });

function quotaUsed() {
  const q = store.get("quota", { day: "", used: 0 });
  return q.day === todayPT() ? q.used : 0;
}
function addQuota(units) {
  store.set("quota", { day: todayPT(), used: quotaUsed() + units });
  showQuota();
}
function showQuota() {
  document.getElementById("quota").textContent =
    `${quotaUsed().toLocaleString()} / ${DAILY_QUOTA.toLocaleString()} units today`;
}

/* =========================================================================
   4. THE API LAYER
   Every request goes through yt(). Keeping it in one place means phase 2
   (Invidious) only has to replace this layer, not the whole app.
   ========================================================================= */
const API_BASE = "https://www.googleapis.com/youtube/v3/";
const cache = new Map(); // same request twice in one session = free

async function yt(endpoint, params) {
  const key = store.get("apiKey", "");
  if (!key) throw new Error("No API key set. Add one in Settings.");

  const cacheKey = endpoint + "?" + new URLSearchParams(params);
  if (cache.has(cacheKey)) return cache.get(cacheKey);

  const url = API_BASE + endpoint + "?" + new URLSearchParams({ ...params, key });
  const res = await fetch(url);          // rejects only on network/CORS failure
  addQuota(COST[endpoint] ?? 1);         // Google charges even for failed calls

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {                          // 4xx/5xx are still "successful" fetches
    throw new Error(data?.error?.message || `HTTP ${res.status}`);
  }
  cache.set(cacheKey, data);
  return data;
}

// videos.list takes up to 50 IDs per call and gives duration + view count,
// which search results don't include.
async function getVideos(ids) {
  ids = ids.filter(Boolean);
  const items = [];
  for (let i = 0; i < ids.length; i += 50) {
    const data = await yt("videos", {
      part: "snippet,contentDetails,statistics",
      id: ids.slice(i, i + 50).join(","),
    });
    items.push(...data.items);
  }
  const byId = new Map(items.map((it) => [it.id, it]));
  return ids.map((id) => byId.get(id)).filter(Boolean); // keep the original order
}

// Flatten the API's nested shape into what the UI needs.
function fromVideo(item) {
  const s = item.snippet;
  return {
    id: item.id,
    title: decode(s.title),
    channelId: s.channelId,
    channelTitle: decode(s.channelTitle),
    publishedAt: s.publishedAt,
    thumb: s.thumbnails?.medium?.url || s.thumbnails?.default?.url || "",
    duration: item.contentDetails?.duration,
    views: item.statistics?.viewCount,
    likes: item.statistics?.likeCount,
    live: s.liveBroadcastContent,
    description: s.description || "",
  };
}

// Trick: a channel ID "UCxxxx" has an uploads playlist "UUxxxx".
// playlistItems costs 1 unit; searching a channel's videos would cost 100.
const uploadsOf = (channelId) => "UU" + channelId.slice(2);

/* =========================================================================
   5. FORMATTING
   ========================================================================= */
function fmtDuration(iso) {                  // "PT1H2M3S" -> "1:02:03"
  const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || "");
  if (!m) return "";
  const [h, min, s] = [m[1], m[2], m[3]].map((x) => Number(x) || 0);
  const pad = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${pad(min)}:${pad(s)}` : `${min}:${pad(s)}`;
}

const fmtNum = (n) => new Intl.NumberFormat("en", { notation: "compact" }).format(Number(n));

function timeAgo(iso) {
  if (!iso) return "";
  const sec = (new Date(iso) - Date.now()) / 1000;
  const rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
  const units = [["year", 31536000], ["month", 2592000], ["week", 604800],
                 ["day", 86400], ["hour", 3600], ["minute", 60]];
  for (const [unit, size] of units) {
    if (Math.abs(sec) >= size) return rtf.format(Math.round(sec / size), unit);
  }
  return "just now";
}

/* =========================================================================
   6. SMALL UI PIECES (functions that return HTML strings)
   ========================================================================= */
function card(v) {
  const badge = v.live === "live" ? "LIVE" : fmtDuration(v.duration);
  const watch = `#/watch/${encodeURIComponent(v.id)}`;
  return `
    <div class="card">
      <a class="thumb" href="${watch}">
        <img loading="lazy" src="${esc(v.thumb)}" alt="">
        ${badge ? `<span class="dur">${badge}</span>` : ""}
      </a>
      <a class="title" href="${watch}" title="${esc(v.title)}">${esc(v.title)}</a>
      <a class="meta" href="#/channel/${encodeURIComponent(v.channelId)}">${esc(v.channelTitle)}</a>
      <div class="meta">${v.views ? fmtNum(v.views) + " views · " : ""}${timeAgo(v.publishedAt)}</div>
    </div>`;
}

const grid = (videos) => videos.length
  ? `<div class="grid">${videos.map(card).join("")}</div>`
  : `<p class="meta">Nothing here.</p>`;

const isSubbed = (id) => store.get("subs", []).some((s) => s.id === id);

function subButton(id, title, thumb) {
  const on = isSubbed(id);
  return `<button class="btn ${on ? "" : "primary"}" data-action="toggleSub"
            data-id="${esc(id)}" data-title="${esc(title)}" data-thumb="${esc(thumb)}">
            ${on ? "Subscribed" : "Subscribe"}</button>`;
}

function addHistory(v) {
  const { description, ...slim } = v;   // don't store long descriptions
  const history = store.get("history", []).filter((h) => h.id !== v.id);
  history.unshift({ ...slim, watchedAt: Date.now() });
  store.set("history", history.slice(0, 200));
}

/* =========================================================================
   7. VIEWS: one async function per page, each returns HTML
   ========================================================================= */
const views = {

  // Feed = newest uploads from every subscription, merged.
  async home() {
    const subs = store.get("subs", []);
    if (!subs.length) {
      return `<h2>Welcome</h2>
        <p class="meta">Search for something, open a channel or video, and press Subscribe.
        Your subscription feed will appear here. Subscriptions live only in this browser.</p>`;
    }
    // Promise.all fires all requests at once instead of one after another.
    const lists = await Promise.all(subs.map((s) =>
      yt("playlistItems", { part: "contentDetails", playlistId: uploadsOf(s.id), maxResults: 8 })
        .catch(() => ({ items: [] }))       // one dead channel shouldn't break the feed
    ));
    const newest = lists
      .flatMap((l) => l.items)
      .map((it) => it.contentDetails)
      .filter((c) => c.videoPublishedAt)
      .sort((a, b) => b.videoPublishedAt.localeCompare(a.videoPublishedAt))
      .slice(0, 48);
    const videos = (await getVideos(newest.map((c) => c.videoId))).map(fromVideo);
    return `<h2>Your feed</h2>
      <p class="meta">${subs.length} subscriptions · about ${subs.length + Math.ceil(videos.length / 50)} units per refresh</p>
      ${grid(videos)}`;
  },

  async search(_, params) {
    const q = (params.get("q") || "").trim();
    if (!q) return `<p class="meta">Type something to search.</p>`;
    const req = { part: "snippet", type: "video", maxResults: 24, q };
    if (params.get("page")) req.pageToken = params.get("page");

    const data = await yt("search", req);
    const videos = (await getVideos(data.items.map((it) => it.id.videoId))).map(fromVideo);
    const next = data.nextPageToken
      ? `<a class="btn more" href="#/search?${new URLSearchParams({ q, page: data.nextPageToken })}">Next page (100 units)</a>`
      : "";
    return `<h2>Results for “${esc(q)}”</h2>
      <p class="meta">Searches are the expensive call: 100 units each.</p>
      ${grid(videos)}${next}`;
  },

  async watch(id) {
    const [item] = await getVideos([id]);
    if (!item) return `<div class="notice">This video wasn't found. It may be private or deleted.</div>`;
    const v = fromVideo(item);
    addHistory(v);

    const [chan, comments] = await Promise.all([
      yt("channels", { part: "snippet,statistics", id: v.channelId }).then((d) => d.items?.[0]).catch(() => null),
      yt("commentThreads", { part: "snippet", videoId: id, maxResults: 20, order: "relevance", textFormat: "plainText" })
        .catch(() => null),                 // comments can be disabled -> 403
    ]);

    const avatar = chan?.snippet?.thumbnails?.default?.url || "";
    const subCount = chan?.statistics?.hiddenSubscriberCount ? "" : chan?.statistics?.subscriberCount;

    const commentsHtml = comments
      ? comments.items.map((t) => {
          const c = t.snippet.topLevelComment.snippet;
          return `<div class="comment">
            <img class="avatar" loading="lazy" src="${esc(c.authorProfileImageUrl)}" alt="">
            <div>
              <div class="meta"><b>${esc(c.authorDisplayName)}</b> · ${timeAgo(c.publishedAt)}${c.likeCount ? " · 👍 " + fmtNum(c.likeCount) : ""}</div>
              <p>${linkify(esc(decode(c.textDisplay)))}</p>
            </div>
          </div>`;
        }).join("")
      : `<p class="meta">Comments are unavailable for this video.</p>`;

    // youtube-nocookie.com: the privacy-enhanced embed domain.
    // The referrer policy matters: YouTube's embed refuses to play without one.
    return `
      <div class="player">
        <iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <h1>${esc(v.title)}</h1>
      <div class="row">
        <a href="#/channel/${encodeURIComponent(v.channelId)}"><img class="avatar" src="${esc(avatar)}" alt=""></a>
        <div>
          <a href="#/channel/${encodeURIComponent(v.channelId)}"><b>${esc(v.channelTitle)}</b></a>
          <div class="meta">${subCount ? fmtNum(subCount) + " subscribers" : ""}</div>
        </div>
        ${subButton(v.channelId, v.channelTitle, avatar)}
        <a class="btn" href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
      </div>
      <div class="box"><b>${v.views ? fmtNum(v.views) + " views · " : ""}${timeAgo(v.publishedAt)}${v.likes ? " · 👍 " + fmtNum(v.likes) : ""}</b>

${linkify(esc(v.description))}</div>
      <h2>Comments</h2>
      ${commentsHtml}`;
  },

  async channel(id, params) {
    const data = await yt("channels", { part: "snippet,statistics,contentDetails", id });
    const c = data.items?.[0];
    if (!c) return `<div class="notice">Channel not found.</div>`;

    const req = { part: "contentDetails", playlistId: c.contentDetails.relatedPlaylists.uploads, maxResults: 24 };
    if (params.get("page")) req.pageToken = params.get("page");
    const list = await yt("playlistItems", req);
    const videos = (await getVideos(list.items.map((it) => it.contentDetails.videoId))).map(fromVideo);

    const title = decode(c.snippet.title);
    const avatar = c.snippet.thumbnails?.medium?.url || c.snippet.thumbnails?.default?.url || "";
    const st = c.statistics;
    const next = list.nextPageToken
      ? `<a class="btn more" href="#/channel/${encodeURIComponent(id)}?page=${encodeURIComponent(list.nextPageToken)}">Older videos</a>`
      : "";
    return `
      <div class="row">
        <img class="avatar big" src="${esc(avatar)}" alt="">
        <div style="flex:1;min-width:200px">
          <h1 style="margin:0">${esc(title)}</h1>
          <div class="meta">${st.hiddenSubscriberCount ? "" : fmtNum(st.subscriberCount) + " subscribers · "}${fmtNum(st.videoCount)} videos</div>
        </div>
        ${subButton(id, title, avatar)}
      </div>
      ${c.snippet.description ? `<div class="box" style="max-height:8em;overflow:auto">${linkify(esc(decode(c.snippet.description)))}</div>` : ""}
      <h2>Uploads</h2>
      ${grid(videos)}${next}`;
  },

  subs() {
    const subs = store.get("subs", []);
    if (!subs.length) return `<h2>Subscriptions</h2><p class="meta">You haven't subscribed to anything yet.</p>`;
    return `<h2>Subscriptions (${subs.length})</h2>` + subs.map((s) => `
      <div class="list-item">
        <img class="avatar" src="${esc(s.thumb)}" alt="">
        <a class="grow" href="#/channel/${encodeURIComponent(s.id)}">${esc(s.title)}</a>
        ${subButton(s.id, s.title, s.thumb)}
      </div>`).join("");
  },

  history() {
    const history = store.get("history", []);
    return `
      <div class="row"><h2 style="margin:0;flex:1">History</h2>
        ${history.length ? `<button class="btn" data-action="clearHistory">Clear history</button>` : ""}</div>
      <p class="meta">Stored only in this browser. Free to view: no API calls.</p>
      ${grid(history)}`;
  },

  settings(_, params) {
    const key = store.get("apiKey", "");
    return `
      <h2>Settings</h2>
      ${params.get("need") ? `<div class="notice">Add a YouTube Data API v3 key to get started.</div>` : ""}
      <label>YouTube Data API key
        <input id="api-key" type="password" value="${esc(key)}" placeholder="AIza..." autocomplete="off">
      </label>
      <button class="btn primary" data-action="saveKey">Save</button>
      ${key ? `<button class="btn" data-action="removeKey">Remove key</button>` : ""}
      <p class="meta">The key is saved in this browser's localStorage and sent only to googleapis.com.
      Restrict it in Google Cloud Console to your local address (for example http://localhost:8000/*).</p>
      <p class="meta">Estimated usage today: ${quotaUsed().toLocaleString()} of ${DAILY_QUOTA.toLocaleString()} units
      (resets at midnight Pacific time).</p>`;
  },
};

/* =========================================================================
   8. ACTIONS: one click listener for the whole page ("event delegation").
   Pages are re-rendered as HTML strings, so attaching listeners to each
   button would mean re-attaching after every render. Instead we listen
   once on document and look at which element was clicked.
   ========================================================================= */
const actions = {
  toggleSub(btn) {
    const { id, title, thumb } = btn.dataset;
    let subs = store.get("subs", []);
    subs = isSubbed(id) ? subs.filter((s) => s.id !== id) : [...subs, { id, title, thumb }];
    store.set("subs", subs);
    const on = isSubbed(id);
    btn.textContent = on ? "Subscribed" : "Subscribe";
    btn.classList.toggle("primary", !on);
  },
  clearHistory() {
    store.set("history", []);
    route();
  },
  saveKey() {
    const key = document.getElementById("api-key").value.trim();
    if (!key) return;
    store.set("apiKey", key);
    cache.clear();
    location.hash = "#/";
  },
  removeKey() {
    store.set("apiKey", "");
    route();
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (el) actions[el.dataset.action]?.(el);
});

document.getElementById("search-form").addEventListener("submit", (e) => {
  e.preventDefault();                         // stop the page from reloading
  const q = document.getElementById("q").value.trim();
  if (q) location.hash = "#/search?" + new URLSearchParams({ q });
});

/* =========================================================================
   9. ROUTER
   Everything after "#" is ours: the browser never sends it to a server,
   and changing it fires "hashchange" without reloading. That's how one
   HTML file can have many "pages" and a working back button.
   ========================================================================= */
const main = document.querySelector("main");
let currentRender = 0;

function parseHash() {
  const [path, qs = ""] = (location.hash.slice(1) || "/").split("?");
  const parts = path.split("/").filter(Boolean).map(decodeURIComponent);
  return { parts, params: new URLSearchParams(qs) };
}

async function route() {
  const ticket = ++currentRender;             // newer navigation wins races
  const { parts, params } = parseHash();
  const name = views[parts[0]] ? parts[0] : "home";

  document.getElementById("q").value = name === "search" ? params.get("q") || "" : "";
  if (!store.get("apiKey", "") && !["settings", "subs", "history"].includes(name)) {
    location.hash = "#/settings?need=1";
    return;
  }

  main.innerHTML = `<p class="meta">Loading…</p>`;
  try {
    const html = await views[name](parts[1], params);
    if (ticket !== currentRender) return;     // user already clicked elsewhere
    main.innerHTML = html;
    window.scrollTo(0, 0);
  } catch (err) {
    if (ticket !== currentRender) return;
    main.innerHTML = `<div class="notice"><b>Something went wrong.</b><br>${esc(err.message)}</div>`;
  }
}

window.addEventListener("hashchange", route);
showQuota();
route();
</script>
</body>
</html>
